<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
  <title id="title">공격 실행자 상속 관계</title>
  <desc id="desc">주요 공격 실행자 상속 관계입니다. AttackExecutor에서 AreaAttackExecutor, ProjectileAttackExecutor, SkillExecutor로 상속됩니다. SkillExecutor에서 검 스킬, 활 스킬과 궁극기, 스태프 스킬과 궁극기 실행자로 상속됩니다. 모든 선은 부모 박스 오른쪽 중앙에서 출발합니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#35a3c9"/>
    </marker>
    <style>
      .node { fill: #24282b; stroke: #35a3c9; stroke-width: 1.4; }
      .edge { fill: none; stroke: #35a3c9; stroke-width: 1.6; marker-end: url(#arrow); }
      text { fill: #eeeeee; font-family: 'Malgun Gothic', sans-serif; font-size: 15px; text-anchor: middle; }
    </style>
  </defs>
  <path class="edge" d="M 240 170 H 285 V 50 H 340"/>
  <path class="edge" d="M 240 170 H 340"/>
  <path class="edge" d="M 240 170 H 285 V 290 H 340"/>
